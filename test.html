<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thamahrai Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 500px;
            margin: auto;
        }
        input, textarea, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Test Order Submission</h2>

    <label>Name</label>
    <input type="text" id="name" placeholder="Enter your name">

    <label>Transaction ID</label>
    <input type="text" id="txn" placeholder="Enter Transaction ID">

    <label>Amount (Optional)</label>
    <input type="number" id="amount" placeholder="Enter Amount">

    <label>Order Details</label>
    <textarea id="order" rows="4" placeholder="Enter order details"></textarea>

    <label>Upload Screenshot</label>
    <input type="file" id="image" accept="image/*">

    <button onclick="submitForm()">Submit to Google Sheet</button>

    <p id="status"></p>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwRUTT6KqysIbOLoP-PlZiTXwGRJklPBc5BNVShjHo0GCINL17b-BH8ywoieO0VzBcK/exec";

async function submitForm() {
    const statusEl = document.getElementById("status");
    statusEl.innerHTML = "Submitting...";

    const name = document.getElementById("name").value;
    const txn = document.getElementById("txn").value;
    const order = document.getElementById("order").value;
    const amount = document.getElementById("amount").value;
    const imageFile = document.getElementById("image").files[0];

    if (!name || !txn || !order || !imageFile) {
        statusEl.innerHTML = "<span class='error'>All fields including screenshot are required.</span>";
        return;
    }

    // Convert image to base64
    const base64 = await toBase64(imageFile);

    const payload = {
        name: name,
        transactionId: txn,
        order: order,
        amount: amount,
        phone: "",               // Your script will fill "Not provided"
        imageBase64: base64
    };

    try {
        const response = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.success) {
            statusEl.innerHTML = "<span class='success'>Success! Google Sheet updated & Email sent.</span>";
        } else {
            statusEl.innerHTML = "<span class='error'>Failed! Script returned an error.</span>";
        }

    } catch (err) {
        statusEl.innerHTML = "<span class='error'>Network Error: " + err + "</span>";
    }
}

// Convert uploaded file to Base64
function toBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
}
</script>

</body>
</html>
