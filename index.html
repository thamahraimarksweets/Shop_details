<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍰 Sweet Bakery Order Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎂 Order Your Dream Cake!</h1>
        <form id="cakeForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" placeholder="Enter your phone number">
            </div>

            <div class="form-group">
                <label for="cake">Cake Type</label>
                <select id="cake">
                    <option value="">Select Cake</option>
                    <option value="Chocolate">Chocolate</option>
                    <option value="Vanilla">Vanilla</option>
                    <option value="Strawberry">Strawberry</option>
                    <option value="Red Velvet">Red Velvet</option>
                </select>
            </div>

            <div class="form-group">
                <label for="weight">Weight (kg)</label>
                <select id="weight">
                    <option value="">Select Weight</option>
                    <option value="0.5">0.5 kg</option>
                    <option value="1">1 kg</option>
                    <option value="1.5">1.5 kg</option>
                    <option value="2">2 kg</option>
                    <option value="3">3 kg</option>
                </select>
            </div>

            <div class="form-group toppings">
                <label>Toppings</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" value="Chocolate Chips"> 🍫 Chocolate Chips</label>
                    <label><input type="checkbox" value="Fruits"> 🍓 Fruits</label>
                    <label><input type="checkbox" value="Nuts"> 🌰 Nuts</label>
                    <label><input type="checkbox" value="Sprinkles"> 🌈 Sprinkles</label>
                </div>
            </div>

            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" min="1" placeholder="How many cakes?">
            </div>

            <div class="form-group">
                <label for="date">Delivery Date</label>
                <input type="date" id="date">
            </div>

            <div class="form-group">
                <label for="address">Delivery Address</label>
                <textarea id="address" placeholder="Enter delivery address"></textarea>
            </div>

            <div class="form-group payment">
                <label>Payment Mode</label>
                <label><input type="radio" name="payment" value="Cash"> 💵 Cash</label>
                <label><input type="radio" name="payment" value="Card"> 💳 Card</label>
                <label><input type="radio" name="payment" value="UPI"> 📲 UPI</label>
            </div>

            <button type="submit">Order Now 🎀</button>
        </form>
        <p id="message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
