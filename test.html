<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Order Submission</title>
    <style>
        body {
            background: #f0f0f0;
            font-family: Arial, sans-serif;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
            width: 400px;
        }
        input, textarea, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            font-size: 15px;
        }
        button {
            background: #0078ff;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        button:hover {
            background: #005fcc;
        }
        #status {
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>

<div class="container">
    <h2>Test Order Submission</h2>

    <label>Name</label>
    <input type="text" id="name" placeholder="Enter your name">

    <label>Transaction ID</label>
    <input type="text" id="txn" placeholder="Enter Transaction ID">

    <label>Amount (Optional)</label>
    <input type="number" id="amount" placeholder="Enter Amount">

    <label>Order Details</label>
    <textarea id="order" rows="3" placeholder="Enter order details"></textarea>

    <label>Upload Screenshot</label>
    <input type="file" id="image" accept="image/*">

    <button onclick="submitForm()">Submit to Google Sheet</button>

    <p id="status"></p>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwRUTT6KqysIbOLoP-PlZiTXwGRJklPBc5BNVShjHo0GCINL17b-BH8ywoieO0VzBcK/exec";  // <-- CHANGE THIS

async function submitForm() {
    const statusEl = document.getElementById("status");
    statusEl.innerHTML = "Submitting...";

    const name = document.getElementById("name").value.trim();
    const txn = document.getElementById("txn").value.trim();
    const order = document.getElementById("order").value.trim();
    const amount = document.getElementById("amount").value.trim();
    const imageFile = document.getElementById("image").files[0];

    // Basic validation
    if (!name || !txn || !order || !imageFile) {
        statusEl.innerHTML = "<span class='error'>All fields including screenshot are required.</span>";
        return;
    }

    // Convert image to Base64
    const base64 = await fileToBase64(imageFile);

    // Create form data
    let form = new FormData();
    form.append("name", name);
    form.append("transactionId", txn);
    form.append("order", order);
    form.append("amount", amount);
    form.append("phone", ""); // your script fills "Not provided"
    form.append("imageBase64", base64);

    try {
        const response = await fetch(SCRIPT_URL, {
            method: "POST",
            body: form
        });

        const result = await response.json();

        if (result.success) {
            statusEl.innerHTML = "<span class='success'>Success! Sheet updated & email sent.</span>";
        } else {
            statusEl.innerHTML = "<span class='error'>Script returned failure.</span>";
        }

    } catch (err) {
        statusEl.innerHTML = "<span class='error'>Network Error: " + err + "</span>";
    }
}

// Convert image to Base64
function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
}
</script>

</body>
</html>
